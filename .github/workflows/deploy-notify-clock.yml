# Deploy the bd binary that drives the notify clock.
#
# The clock (bd-due-sweep.service) runs a pinned copy at
# ~/.local/libexec/bd-due-sweep-bd. Nothing rebuilt that copy, so the
# 2026-09-13 build survived three later notify fixes and routed a daily wake
# with fuzzy seat scoring to a random lookalike pane (wiseman-y67). A pinned
# binary nothing rebuilds is a frozen binary, so: rebuild from main, install
# atomically, verify against the live outbox and schema, every push that can
# change the binary - plus daily, so drift cannot accumulate silently.
name: Deploy notify clock

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/notify/**'
      - '.github/workflows/deploy-notify-clock.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-notify-clock
  cancel-in-progress: false

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"
  CLOCK_BIN: /home/jon/.local/libexec/bd-due-sweep-bd

jobs:
  guard:
    name: Notify guard (exact pin only)
    # bd-clock marks the box that owns this clock's unit and binaries. Two
    # runners carry `gpu` (beads-agt10 has no bd-due-sweep unit), and an install
    # on the wrong host silently leaves this box stale - which is how the deploy
    # lane failed twice on 10-04/10-05.
    runs-on: [self-hosted, gpu, bd-clock]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fuzzy resolver and duplicate transport stay deleted
        run: ./scripts/notify/test_beads_notify_e2e.sh

  deploy:
    name: Rebuild + install clock binary
    runs-on: [self-hosted, gpu, bd-clock]
    needs: guard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: This host owns the clock
        run: |
          set -euo pipefail
          # Prove ownership BEFORE building or writing anything: the unit must
          # point at the binary this job installs. On a host without the unit
          # this fails fast instead of installing a binary nobody runs.
          grep -E '^Environment=BD_DUE_SWEEP_BD=(%h|/home/jon)/\.local/libexec/bd-due-sweep-bd$' \
            /home/jon/.config/systemd/user/bd-due-sweep.service.d/override.conf

      - name: Check Go toolchain
        run: go version

      - name: Build bd
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -tags=gms_pure_go -o "$RUNNER_TEMP/bd" ./cmd/bd

      - name: Install (atomic, keep previous)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CLOCK_BIN")"
          [ -f "$CLOCK_BIN" ] && cp -f "$CLOCK_BIN" "$CLOCK_BIN.prev" || true
          install -m 0755 "$RUNNER_TEMP/bd" "$CLOCK_BIN"

      - name: Verify installed binary against the live clock
        run: |
          set -euo pipefail
          "$CLOCK_BIN" --version

          cd /opt/ra/firstmate

          # Schema must be current. Pending migrations gate writes on a
          # remote-backed DB, so a skew here means the clock silently stops
          # enqueueing and nobody hears about it.
          "$CLOCK_BIN" migrate schema --json

          # The notify outbox must be readable and drainable in print mode:
          # same code path as delivery, no herdr submit, no acks.
          "$CLOCK_BIN" notify drain --all --print --no-ack >/dev/null

      - name: Roll back on failure
        if: failure()
        run: |
          set -uo pipefail
          if [ -f "$CLOCK_BIN.prev" ]; then
            install -m 0755 "$CLOCK_BIN.prev" "$CLOCK_BIN"
            echo "rolled back to previous clock binary: $("$CLOCK_BIN" --version)" >&2
          fi

  # The release cut rides the same train as the clock deploy: a merge to main
  # that changes the binary rebuilds it, and if cmd/bd/version.go names a
  # version nobody has released yet, that build becomes the release and is
  # installed as the machine's `bd`. Tagging by hand is how a release lags the
  # code that is already running in production.
  release-cut:
    name: Cut release (after merged deploy)
    runs-on: [self-hosted, gpu, bd-clock]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build release binary
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="$(grep 'Version = ' cmd/bd/version.go | sed 's/.*"\(.*\)".*/\1/')"
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          go build -trimpath -tags=gms_pure_go \
            -ldflags "-X main.Version=$version -X main.Build=$sha" \
            -o "$RUNNER_TEMP/bd-linux-amd64" ./cmd/bd
          "$RUNNER_TEMP/bd-linux-amd64" version

      - name: Create release if this version is not out yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to cut."
            exit 0
          fi
          sum="$(sha256sum "$RUNNER_TEMP/bd-linux-amd64" | cut -d' ' -f1)"
          {
            echo "Automated cut from main after the notify-clock deploy."
            echo
            echo "commit: $GITHUB_SHA"
            echo "sha256(bd-linux-amd64): $sum"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/bd-linux-amd64#bd-linux-amd64" \
            --target "$GITHUB_SHA" \
            --title "bd $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Install bd for this machine (keep previous)
        run: |
          set -euo pipefail
          target="$HOME/.local/bin/bd"
          [ -f "$target" ] && cp -f "$target" "$target.prev" || true
          install -m 0755 "$RUNNER_TEMP/bd-linux-amd64" "$target"
          "$target" version
