# Deploy the fleet bd binary and cut releases.
#
# History: this lane used to rebuild the clock's pinned copy at
# ~/.local/libexec/bd-due-sweep-bd, because a frozen 2026-09-13 build survived
# three notify fixes and routed a daily wake with fuzzy seat scoring to a
# random lookalike pane (wiseman-y67). The clock itself is gone now (deleted
# 2026-10-12 by captain order). What remains is the lesson and the work:
# rebuild from main, install atomically to ~/.local/bin/bd, verify against the
# live schema, every push that can change the binary - plus daily, so drift
# cannot accumulate silently.
name: Deploy notify clock

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/notify/**'
      - '.github/workflows/deploy-notify-clock.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-notify-clock
  cancel-in-progress: false

permissions:
  contents: read

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"
  INSTALL_BIN: /home/jon/.local/bin/bd

jobs:
  guard:
    name: Notify guard (exact pin only)
    # bd-clock marks the box this lane installs to. Two runners carry `gpu`,
    # and an install on the wrong host silently leaves this box stale - which
    # is how the deploy lane failed twice on 10-04/10-05. The clock this label
    # once named is gone (deleted 2026-10-12); the label still pins installs
    # to this host.
    runs-on: [self-hosted, gpu, bd-clock]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fuzzy resolver and duplicate transport stay deleted
        run: ./scripts/notify/test_beads_notify_e2e.sh

  deploy:
    name: Rebuild + install bd binary
    runs-on: [self-hosted, gpu, bd-clock]
    needs: guard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check Go toolchain
        run: go version

      - name: Build bd
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -tags=gms_pure_go -o "$RUNNER_TEMP/bd" ./cmd/bd

      - name: Install (atomic, keep previous)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INSTALL_BIN")"
          [ -f "$INSTALL_BIN" ] && cp -f "$INSTALL_BIN" "$INSTALL_BIN.prev" || true
          install -m 0755 "$RUNNER_TEMP/bd" "$INSTALL_BIN"

      - name: Verify installed binary against the live workspace
        env:
          # The lane's own identity: a machine actor the strict seat
          # registry admits. An empty actor refuses every write.
          BEADS_ACTOR: bd-deploy
          # The verify migrates the live remote-backed store. The consent
          # gate (AllowRemoteMigrateEnv) refuses auto-apply without this;
          # the lane IS the deliberate operator in that step.
          BD_ALLOW_REMOTE_MIGRATE: "1"
        run: |
          set -euo pipefail
          "$INSTALL_BIN" --version

          cd /opt/ra/firstmate

          # Schema must be current. Pending migrations gate writes on a
          # remote-backed DB, so a skew here means the clock silently stops
          # enqueueing and nobody hears about it.
          "$INSTALL_BIN" migrate schema --json

      - name: Roll back on failure
        if: failure()
        run: |
          set -uo pipefail
          if [ -f "$INSTALL_BIN.prev" ]; then
            install -m 0755 "$INSTALL_BIN.prev" "$INSTALL_BIN"
            echo "rolled back to previous bd binary: $("$INSTALL_BIN" --version)" >&2
          fi

  # The release cut rides the same train as the clock deploy: a merge to main
  # that changes the binary rebuilds it, and if cmd/bd/version.go names a
  # version nobody has released yet, that build becomes the release and is
  # installed as the machine's `bd`. Tagging by hand is how a release lags the
  # code that is already running in production.
  release-cut:
    name: Cut release (after merged deploy)
    runs-on: [self-hosted, gpu, bd-clock]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build release binary
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="$(grep 'Version = ' cmd/bd/version.go | sed 's/.*"\(.*\)".*/\1/')"
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          go build -trimpath -tags=gms_pure_go \
            -ldflags "-X main.Version=$version -X main.Build=$sha" \
            -o "$RUNNER_TEMP/bd-linux-amd64" ./cmd/bd
          "$RUNNER_TEMP/bd-linux-amd64" version

      - name: Create release if this version is not out yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to cut."
            exit 0
          fi
          sum="$(sha256sum "$RUNNER_TEMP/bd-linux-amd64" | cut -d' ' -f1)"
          {
            echo "Automated cut from main after the notify-clock deploy."
            echo
            echo "commit: $GITHUB_SHA"
            echo "sha256(bd-linux-amd64): $sum"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/bd-linux-amd64#bd-linux-amd64" \
            --target "$GITHUB_SHA" \
            --title "bd $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Install bd for this machine (keep previous)
        run: |
          set -euo pipefail
          target="$HOME/.local/bin/bd"
          [ -f "$target" ] && cp -f "$target" "$target.prev" || true
          install -m 0755 "$RUNNER_TEMP/bd-linux-amd64" "$target"
          "$target" version
